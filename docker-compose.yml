services:
  postgres:
    image: postgres:16-alpine
    container_name: pediatric_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pediatric_erp_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=es_AR.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pediatric_erp_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pediatric_erp_network

  # Servicio de adminer para inspección rápida de la DB en desarrollo
  adminer:
    image: adminer:4.8.1
    container_name: pediatric_erp_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: hydra
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pediatric_erp_network
    profiles:
      - tools

volumes:
  pgdata:
    driver: local

networks:
  pediatric_erp_network:
    driver: bridge
